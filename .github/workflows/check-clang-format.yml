name: CI clang-format

on: [push, pull_request]

jobs:
  clang-format-check:
    name: clang-format-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Git submodules
        run: |
          git submodule sync
          git submodule update --init --recursive

      # clang-format-14 is no longer packaged for recent Ubuntu runners:
      - name: Install clang-format-14
        run: |
          pipx install clang-format==14.0.6
          ln -sf "$(command -v clang-format)" "$(dirname "$(command -v clang-format)")/clang-format-14"
          clang-format-14 --version

      - name: Check code style
        run: bash scripts/formatter.sh --check

